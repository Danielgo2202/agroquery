[project]
name = "agroquery"
version = "0.1.0"
description = "Cost-aware LLM agents for natural-language analysis of agricultural sensor and weather data in PostgreSQL."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Daniel Andrés Gómez Ávila" }]
dependencies = [
    "anthropic>=0.70",
    "ollama>=0.4",
    "psycopg[binary]>=3.2",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "httpx>=0.27",
    "matplotlib>=3.8",
    "python-dotenv>=1.0",
]

[project.scripts]
agroquery = "agroquery.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agroquery"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
